async function decrypt(raw){const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv),additionalData:decode(payload.aad),tagLength:128},key,decode(payload.data));return new TextDecoder().decode(bytes)}
function display(page){
  // Cached-key decryption can finish while this unlock document is still parsing.
  // Opening the document then appends the dashboard beneath the login panel.
  if(document.readyState!=='complete'){
    window.addEventListener('load',()=>display(page),{once:true});
    return;
  }
  document.open();document.write(page);document.close();
}
async function derive(password){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:decode(salt),iterations:payload.iterations,hash:'SHA-256'},material,256))}
if(new URL(location.href).searchParams.has('lock'))sessionStorage.removeItem(keyName);
else{const cached=sessionStorage.getItem(keyName);if(cached)decrypt(decode(cached)).then(display).catch(()=>sessionStorage.removeItem(keyName))}
form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;status.textContent='Opening…';try{const raw=await derive(input.value);input.value='';const page=await decrypt(raw);sessionStorage.setItem(keyName,btoa(String.fromCharCode(...raw)));display(page)}catch{input.value='';status.textContent='The passphrase did not open this page.';button.disabled=false;input.focus()}});
