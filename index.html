<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>body{min-height:100svh;margin:0;display:grid;place-items:center;background:#f2efe7;color:#1b2430;font:16px/1.5 system-ui,sans-serif}.panel{width:min(430px,calc(100% - 48px));padding:36px;background:#fffdf7;border:1px solid #d7d1c4;border-radius:22px;box-shadow:0 18px 46px #1b243019}h1{font-size:2rem;line-height:1.1;margin:0 0 12px}p{color:#59636e}label{font-weight:750;display:block;margin:22px 0 7px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #9da59b;border-radius:10px;font:inherit}button{margin-top:14px;padding:12px 20px;border:0;border-radius:999px;background:#d9ff57;color:#1b2430;font:750 1rem system-ui;cursor:pointer}button:disabled{opacity:.5}#status{min-height:1.5em;font-size:.9rem}</style></head>
<body><main class="panel"><h1>Beyond Vibing</h1><p>Team review. Enter the shared passphrase to open this page.</p>
<form id="unlock"><label for="password">Passphrase</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Open</button></form><p id="status" role="status"></p></main>
<script>(()=>{const payload={"version":1,"iterations":600000,"salt":"B+74j33Mo2DLDEqeCfwFyQ==","iv":"kThvqnRmY4YDYoFY","aad":"YmV5b25kLXZpYmluZzp0ZWFtLXNpdGU6djE6aW5kZXguaHRtbA==","data":"nFO/Q+8czR/HHYZYGw/xBRRHBCnSWRoD7xGUio7Hg8KCDOaHpmBGLh9ZT/BZg0++cmvY6S9wMZpm3hzvRQ0xrVuXNwWTC9Wb5qidPcChzyaOtu6MkncDTC/O90dZhEN2VCrkWW2Iz1T/D+nIfzfr91LOlAcNeQns0V0Z9ojbElAueEGIdxdB8ckaj1mTzQ5MJXFhdTAsB/N8XjdEQf/H/cejZxwLzQeyfqTks5v5VudLukpj9NSWxDrmclIEAtS7BnbxRdldO2nNeLT2HKNo02H3xWorkBP3mwa5YXfej9nfm5dPuuz2u7nb/GE="};const salt=payload.salt;const keyName='bv-team-key-v1:'+salt;const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const form=document.getElementById('unlock');const input=document.getElementById('password');const status=document.getElementById('status');
async function decrypt(raw){const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv),additionalData:decode(payload.aad),tagLength:128},key,decode(payload.data));return new TextDecoder().decode(bytes)}
function display(page){
  // Cached-key decryption can finish while this unlock document is still parsing.
  // Opening the document then appends the dashboard beneath the login panel.
  if(document.readyState!=='complete'){
    window.addEventListener('load',()=>display(page),{once:true});
    return;
  }
  document.open();document.write(page);document.close();
}
async function derive(password){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:decode(salt),iterations:payload.iterations,hash:'SHA-256'},material,256))}
if(new URL(location.href).searchParams.has('lock'))sessionStorage.removeItem(keyName);
else{const cached=sessionStorage.getItem(keyName);if(cached)decrypt(decode(cached)).then(display).catch(()=>sessionStorage.removeItem(keyName))}
form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;status.textContent='Opening…';try{const raw=await derive(input.value);input.value='';const page=await decrypt(raw);sessionStorage.setItem(keyName,btoa(String.fromCharCode(...raw)));display(page)}catch{input.value='';status.textContent='The passphrase did not open this page.';button.disabled=false;input.focus()}});
})();</script></body></html>
